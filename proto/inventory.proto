syntax = "proto3";

package inventory;

service InventoryService {
  rpc CheckStock   (ItemsRequest) returns (CheckResponse);
  rpc ReserveStock (ItemsRequest) returns (ReserveResponse);
  rpc ReleaseStock (ItemsRequest) returns (ReserveResponse);
}

message Item {
  int32 product_id = 1;
  int32 quantity   = 2;
}

message ItemsRequest {
  repeated Item items = 1;
}

message CheckResponse {
  bool available = 1;
}

message ReserveResponse {
  bool   success = 1;
  string message = 2;
}